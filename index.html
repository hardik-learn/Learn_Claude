<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energy Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --text: #e8eaf0;
      --muted: #6b7280;
      --accent: #6366f1;
      --accent-dim: #4f46e5;
      --low: #ef4444;
      --mid: #f59e0b;
      --high: #22c55e;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 640px;
      padding: 24px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    header span { font-size: 0.8rem; color: var(--muted); }

    nav {
      width: 100%;
      max-width: 640px;
      display: flex;
      padding: 16px 20px 0;
      gap: 4px;
    }

    nav button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    nav button.active {
      background: var(--surface);
      color: var(--text);
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 20px;
      flex: 1;
    }

    .tab { display: none; }
    .tab.active { display: block; }

    .time-badge {
      text-align: center;
      margin-bottom: 24px;
    }

    .time-badge .hour {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .time-badge .label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .energy-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .energy-btn {
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .energy-btn:hover { transform: scale(1.06); }
    .energy-btn.selected { border-color: var(--accent); background: var(--accent-dim); }

    .energy-btn[data-v="1"], .energy-btn[data-v="2"], .energy-btn[data-v="3"] { color: var(--low); }
    .energy-btn[data-v="4"], .energy-btn[data-v="5"], .energy-btn[data-v="6"] { color: var(--mid); }
    .energy-btn[data-v="7"], .energy-btn[data-v="8"], .energy-btn[data-v="9"], .energy-btn[data-v="10"] { color: var(--high); }

    .energy-btn.selected[data-v="1"],
    .energy-btn.selected[data-v="2"],
    .energy-btn.selected[data-v="3"] { border-color: var(--low); background: #3f1212; }
    .energy-btn.selected[data-v="4"],
    .energy-btn.selected[data-v="5"],
    .energy-btn.selected[data-v="6"] { border-color: var(--mid); background: #3f2a0a; }
    .energy-btn.selected[data-v="7"],
    .energy-btn.selected[data-v="8"],
    .energy-btn.selected[data-v="9"],
    .energy-btn.selected[data-v="10"] { border-color: var(--high); background: #0d2e18; }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.875rem;
      padding: 10px 12px;
      resize: none;
      height: 70px;
      outline: none;
      margin-bottom: 12px;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .log-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .log-btn:hover { background: var(--accent-dim); }
    .log-btn:disabled { opacity: 0.4; cursor: default; }

    .toast {
      margin-top: 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--high);
      height: 20px;
      transition: opacity 0.4s;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .chart-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-label {
      width: 44px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    .chart-bar-wrap {
      flex: 1;
      height: 22px;
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
    }

    .chart-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .chart-value {
      width: 28px;
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .peak-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 20px;
      background: #0d2e18;
      color: var(--high);
      font-weight: 600;
      flex-shrink: 0;
    }

    .insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .insight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .insight-card .card-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .insight-card .card-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .insight-card .card-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Energy Tracker</h1>
    <span id="date-display"></span>
  </header>

  <nav>
    <button class="active" onclick="switchTab('log')">Log</button>
    <button onclick="switchTab('today')">Today</button>
    <button onclick="switchTab('patterns')">Patterns</button>
  </nav>

  <main>
    <section class="tab active" id="tab-log">
      <div class="time-badge">
        <div class="hour" id="current-hour-display"></div>
        <div class="label">Current hour — tap your energy level</div>
      </div>

      <div class="energy-grid" id="energy-grid"></div>

      <textarea id="note-input" placeholder="Optional note (what you're doing, how you feel…)"></textarea>

      <button class="log-btn" id="log-btn" onclick="logEntry()">Log Energy</button>
      <div class="toast" id="toast"></div>
    </section>

    <section class="tab" id="tab-today">
      <p class="section-title">Today's energy</p>
      <div class="chart-wrap" id="today-chart"></div>
    </section>

    <section class="tab" id="tab-patterns">
      <div class="insights" id="insights"></div>
      <p class="section-title">Average energy by hour</p>
      <div class="chart-wrap" id="patterns-chart"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'energy_logs_v1';

    function getLogs() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function currentHour() {
      return new Date().getHours();
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function formatHour(h) {
      if (h === 0) return '12 AM';
      if (h < 12) return `${h} AM`;
      if (h === 12) return '12 PM';
      return `${h - 12} PM`;
    }

    function energyColor(v) {
      if (!v) return 'var(--border)';
      if (v <= 3) return 'var(--low)';
      if (v <= 6) return 'var(--mid)';
      return 'var(--high)';
    }

    function buildEnergyGrid() {
      const grid = document.getElementById('energy-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'energy-btn';
        btn.dataset.v = i;
        btn.textContent = i;
        btn.onclick = () => selectEnergy(i);
        grid.appendChild(btn);
      }
    }

    let selectedEnergy = null;

    function selectEnergy(v) {
      selectedEnergy = v;
      document.querySelectorAll('.energy-btn').forEach(b => {
        b.classList.toggle('selected', Number(b.dataset.v) === v);
      });
    }

    function logEntry() {
      if (!selectedEnergy) return;
      const note = document.getElementById('note-input').value.trim();
      const logs = getLogs();
      const now = new Date();
      const h = currentHour();

      const idx = logs.findIndex(l => l.day === todayKey() && l.hour === h);
      const entry = { day: todayKey(), hour: h, energy: selectedEnergy, note, ts: now.toISOString() };
      if (idx >= 0) logs[idx] = entry;
      else logs.push(entry);

      saveLogs(logs);

      selectedEnergy = null;
      document.querySelectorAll('.energy-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('note-input').value = '';
      showToast('Logged!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 2000);
    }

    function renderToday() {
      const logs = getLogs();
      const today = todayKey();
      const todayLogs = {};
      logs.filter(l => l.day === today).forEach(l => { todayLogs[l.hour] = l; });

      const wrap = document.getElementById('today-chart');

      if (Object.keys(todayLogs).length === 0) {
        wrap.innerHTML = '<p class="empty">No entries yet today. Start logging your energy levels!</p>';
        return;
      }

      wrap.innerHTML = '';
      for (let h = 6; h <= 23; h++) {
        const entry = todayLogs[h];
        const row = document.createElement('div');
        row.className = 'chart-row';

        const pct = entry ? (entry.energy / 10 * 100) : 0;

        row.innerHTML = `
          <span class="chart-label">${formatHour(h)}</span>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="width:${pct}%;background:${energyColor(entry?.energy)}"></div>
          </div>
          <span class="chart-value">${entry ? entry.energy : ''}</span>
          ${entry?.note ? `<span title="${entry.note}" style="font-size:0.75rem;color:var(--muted)">📝</span>` : ''}
        `;
        wrap.appendChild(row);
      }
    }

    function renderPatterns() {
      const logs = getLogs();

      if (logs.length === 0) {
        document.getElementById('insights').innerHTML = '';
        document.getElementById('patterns-chart').innerHTML =
          '<p class="empty">Log a few days of energy levels to see your patterns.</p>';
        return;
      }

      const byHour = {};
      for (let h = 0; h < 24; h++) byHour[h] = { sum: 0, count: 0 };
      logs.forEach(l => {
        byHour[l.hour].sum += l.energy;
        byHour[l.hour].count++;
      });

      const avgs = Object.entries(byHour)
        .filter(([, v]) => v.count > 0)
        .map(([h, v]) => ({ hour: Number(h), avg: v.sum / v.count }));

      avgs.sort((a, b) => b.avg - a.avg);
      const topPeaks = avgs.slice(0, 3);
      const topPeak = avgs[0];
      const bottomVal = [...avgs].sort((a, b) => a.avg - b.avg)[0];

      const totalDays = new Set(logs.map(l => l.day)).size;
      const overallAvg = logs.reduce((s, l) => s + l.energy, 0) / logs.length;

      document.getElementById('insights').innerHTML = `
        <div class="insight-card">
          <div class="card-label">Peak hour</div>
          <div class="card-value" style="color:var(--high)">${topPeak ? formatHour(topPeak.hour) : '—'}</div>
          <div class="card-sub">${topPeak ? `avg ${topPeak.avg.toFixed(1)}/10` : ''}</div>
        </div>
        <div class="insight-card">
          <div class="card-label">Low hour</div>
          <div class="card-value" style="color:var(--low)">${bottomVal ? formatHour(bottomVal.hour) : '—'}</div>
          <div class="card-sub">${bottomVal ? `avg ${bottomVal.avg.toFixed(1)}/10` : ''}</div>
        </div>
        <div class="insight-card">
          <div class="card-label">Overall avg</div>
          <div class="card-value">${overallAvg.toFixed(1)}</div>
          <div class="card-sub">across ${logs.length} entries</div>
        </div>
        <div class="insight-card">
          <div class="card-label">Days tracked</div>
          <div class="card-value">${totalDays}</div>
          <div class="card-sub">days of data</div>
        </div>
      `;

      const maxAvg = Math.max(...avgs.map(a => a.avg), 1);
      const peakHours = new Set(topPeaks.map(p => p.hour));

      const wrap = document.getElementById('patterns-chart');
      wrap.innerHTML = '';

      for (let h = 6; h <= 23; h++) {
        const entry = byHour[h];
        if (entry.count === 0) continue;
        const avg = entry.sum / entry.count;
        const pct = avg / maxAvg * 100;
        const isPeak = peakHours.has(h);

        const row = document.createElement('div');
        row.className = 'chart-row';
        row.innerHTML = `
          <span class="chart-label">${formatHour(h)}</span>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="width:${pct}%;background:${energyColor(avg)}"></div>
          </div>
          <span class="chart-value">${avg.toFixed(1)}</span>
          ${isPeak ? '<span class="peak-badge">peak</span>' : ''}
        `;
        wrap.appendChild(row);
      }
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      const idx = ['log', 'today', 'patterns'].indexOf(name);
      document.querySelectorAll('nav button')[idx].classList.add('active');

      if (name === 'today') renderToday();
      if (name === 'patterns') renderPatterns();
    }

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      document.getElementById('current-hour-display').textContent = `${formatHour(h)}`;
      document.getElementById('date-display').textContent =
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    buildEnergyGrid();
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
